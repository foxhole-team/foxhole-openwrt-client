  <section id="pin-gate" class="pin-gate" data-view="pin" aria-labelledby="pin-prompt">
    <div class="pin-card">
      <img class="pin-logo" src="./assets/foxhole.png?v=0.1.0-r41-ui1" width="512" height="512" alt="FoxHole OpenWRT Client">
      <strong class="pin-brand">FoxHole OpenWRT Client</strong>
      <p id="pin-prompt" class="muted pin-prompt" data-i18n="auth.pin_prompt"></p>
      <form id="pin-form" data-pin-form autocomplete="off">
        <div class="pin-entry" role="group" aria-labelledby="pin-prompt">
          <div class="pin-dots" aria-hidden="true">
            <span data-pin-dot></span>
            <span data-pin-dot></span>
            <span data-pin-dot></span>
            <span data-pin-dot></span>
          </div>
          <input id="pin-input" class="pin-input" name="pin" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" aria-labelledby="pin-prompt">
        </div>
      </form>
      <a class="icon-button pin-router-link" href="/cgi-bin/luci/" data-i18n-title="action.open_luci">
        <svg aria-hidden="true"><use href="#icon-router"/></svg>
        <span class="visually-hidden" data-i18n="action.open_luci"></span>
      </a>
    </div>
  </section>

  <div id="app-shell" class="app-shell" data-view="dashboard" hidden>
    <header id="topbar" class="topbar" data-topbar>
      <a class="brand" href="#dashboard" data-action="scroll-top" aria-label="FoxHole OpenWRT Client">
        <img src="./assets/foxhole.png?v=0.1.0-r41-ui1" width="512" height="512" alt="">
        <span>FoxHole OpenWRT Client</span>
      </a>
      <nav class="topbar-actions" data-i18n-aria-label="nav.primary">
        <button id="add-button" class="icon-button vpn-button" type="button" data-action="open-add" data-i18n-title="action.add_vpn">
          <svg aria-hidden="true"><use href="#icon-shield"/></svg>
          <span data-i18n="action.vpn"></span>
        </button>
        <button id="lock-button" class="icon-button" type="button" data-action="lock" data-i18n-title="action.lock">
          <svg aria-hidden="true"><use href="#icon-lock"/></svg>
          <span class="visually-hidden" data-i18n="action.lock"></span>
        </button>
        <a id="luci-link" class="icon-button" href="/cgi-bin/luci/" data-i18n-title="action.open_luci">
          <svg aria-hidden="true"><use href="#icon-router"/></svg>
          <span class="visually-hidden" data-i18n="action.open_luci"></span>
        </a>
        <button id="settings-button" class="icon-button" type="button" data-action="open-settings" data-i18n-title="action.settings">
          <svg aria-hidden="true"><use href="#icon-settings"/></svg>
          <span class="visually-hidden" data-i18n="action.settings"></span>
        </button>
      </nav>
    </header>

    <main id="dashboard" class="content">
      <section class="intro" data-router-status aria-labelledby="status-heading">
        <h1 id="status-heading" class="pixel-heading">
          <span class="heading-icon" aria-hidden="true"><svg><use href="#icon-activity"/></svg></span>
          <span data-i18n="dashboard.status"></span>
        </h1>
        <div class="section-heading-actions">
          <label class="period-control" data-period-control>
            <span id="period-label" class="visually-hidden" data-i18n="chart.period"></span>
            <select id="period-select" class="compact-select" data-period aria-labelledby="period-label">
              <option value="24h" data-i18n="period.day"></option>
              <option value="7d" data-i18n="period.week"></option>
              <option value="30d" data-i18n="period.month"></option>
            </select>
          </label>
          <button class="section-collapse-button" type="button" data-action="toggle-section" data-section-toggle="status" aria-expanded="true" aria-controls="status-section-body" data-i18n-title="action.collapse">
            <svg aria-hidden="true"><use href="#icon-chevron"/></svg>
            <span class="visually-hidden" data-i18n="action.collapse"></span>
          </button>
        </div>
      </section>

      <div id="status-section-body" class="section-collapse-body" data-section-body="status" data-router-status>
        <section class="chart-grid section-collapse-inner" data-chart-grid data-i18n-aria-label="chart.group">
        <article class="chart-card" data-chart-card="wrt">
          <header class="card-heading">
            <button class="chart-toggle" type="button" data-chart-toggle="wrt" aria-expanded="true" aria-controls="chart-panel-wrt">
              <span class="mini-icon" aria-hidden="true"><svg><use href="#icon-router"/></svg></span>
              <strong id="chart-title-wrt">WRT</strong>
              <i class="chart-chevron" aria-hidden="true"></i>
            </button>
            <span class="chart-meta is-wrt" data-chart-meta="wrt">
              <span><i data-i18n="router.cpu"></i> <b data-meta-cpu>—%</b></span>
              <span><i data-i18n="router.ram"></i> <b data-meta-ram>—%</b></span>
            </span>
          </header>
          <div id="chart-panel-wrt" class="chart-panel">
            <div class="chart-frame">
              <canvas id="chart-wrt" data-chart="wrt" data-action="open-router-stats" tabindex="0" role="button" width="720" height="250" aria-labelledby="chart-title-wrt"></canvas>
              <p class="chart-empty" data-chart-empty="wrt" data-i18n="chart.waiting"></p>
            </div>
          </div>
        </article>

        <article class="chart-card" data-chart-card="network">
          <header class="card-heading">
            <button class="chart-toggle" type="button" data-chart-toggle="network" aria-expanded="true" aria-controls="chart-panel-network">
              <span class="mini-icon" aria-hidden="true"><svg><use href="#icon-network"/></svg></span>
              <strong id="chart-title-network" data-i18n="chart.wan"></strong>
              <i class="chart-chevron" aria-hidden="true"></i>
            </button>
            <span class="chart-meta is-traffic" data-chart-meta="network">
              <span data-i18n-aria-label="router.rx"><svg aria-hidden="true"><use href="#icon-download"/></svg><i data-meta-rx>—</i></span>
              <span data-i18n-aria-label="router.tx"><svg aria-hidden="true"><use href="#icon-upload"/></svg><i data-meta-tx>—</i></span>
            </span>
          </header>
          <div id="chart-panel-network" class="chart-panel">
            <div class="chart-frame">
              <canvas id="chart-network" data-chart="network" data-action="open-router-stats" tabindex="0" role="button" width="720" height="250" aria-labelledby="chart-title-network"></canvas>
              <p class="chart-empty" data-chart-empty="network" data-i18n="chart.waiting"></p>
            </div>
          </div>
        </article>

        <article class="chart-card" data-chart-card="wan-latency">
          <header class="card-heading">
            <button class="chart-toggle" type="button" data-chart-toggle="wan-latency" aria-expanded="true" aria-controls="chart-panel-wan-latency">
              <span class="mini-icon" aria-hidden="true"><svg><use href="#icon-globe"/></svg></span>
              <strong id="chart-title-wan-latency" data-i18n="chart.wan_latency"></strong>
              <i class="chart-chevron" aria-hidden="true"></i>
            </button>
            <span class="chart-meta is-latency" data-chart-meta="wan-latency">
              <b data-meta-wan-address>—</b><b class="inline-country" data-meta-wan-country hidden></b>
            </span>
          </header>
          <div id="chart-panel-wan-latency" class="chart-panel">
            <div class="chart-frame">
              <canvas id="chart-wan-latency" data-chart="wan-latency" data-action="open-router-stats" tabindex="0" role="button" width="720" height="250" aria-labelledby="chart-title-wan-latency"></canvas>
              <p class="chart-empty" data-chart-empty="wan-latency" data-i18n="chart.waiting"></p>
            </div>
          </div>
        </article>

        <article class="chart-card" data-chart-card="vpn-latency">
          <header class="card-heading">
            <button class="chart-toggle" type="button" data-chart-toggle="vpn-latency" aria-expanded="true" aria-controls="chart-panel-vpn-latency">
              <span class="mini-icon" aria-hidden="true"><svg><use href="#icon-shield"/></svg></span>
              <strong id="chart-title-vpn-latency" data-i18n="chart.vpn_latency"></strong>
              <i class="chart-chevron" aria-hidden="true"></i>
            </button>
            <span class="chart-meta is-latency" data-chart-meta="vpn-latency">
              <b data-meta-vpn-address>—</b><b class="inline-country" data-meta-vpn-country hidden></b>
            </span>
          </header>
          <div id="chart-panel-vpn-latency" class="chart-panel">
            <div class="chart-frame">
              <canvas id="chart-vpn-latency" data-chart="vpn-latency" data-action="open-router-stats" tabindex="0" role="button" width="720" height="250" aria-labelledby="chart-title-vpn-latency"></canvas>
              <p class="chart-empty" data-chart-empty="vpn-latency" data-i18n="chart.waiting"></p>
            </div>
          </div>
        </article>
        </section>
      </div>

      <section class="entity-section" aria-labelledby="servers-heading">
        <div class="section-heading">
          <h2 id="servers-heading" class="pixel-heading">
            <span class="heading-icon" aria-hidden="true"><svg><use href="#icon-server"/></svg></span>
            <span data-i18n="servers.title"></span>
          </h2>
          <button class="section-collapse-button" type="button" data-action="toggle-section" data-section-toggle="servers" aria-expanded="true" aria-controls="servers-section-body" data-i18n-title="action.collapse">
            <svg aria-hidden="true"><use href="#icon-chevron"/></svg>
            <span class="visually-hidden" data-i18n="action.collapse"></span>
          </button>
        </div>
        <div id="servers-section-body" class="section-collapse-body" data-section-body="servers">
          <div id="server-list" class="entity-list section-collapse-inner" data-server-list aria-live="polite">
            <div class="empty-state is-entity-empty" data-empty-state="servers">
              <svg aria-hidden="true"><use href="#icon-info"/></svg>
              <strong data-i18n="servers.empty_title"></strong>
            </div>
          </div>
        </div>
      </section>

      <section class="entity-section" aria-labelledby="clients-heading">
        <div class="section-heading">
          <h2 id="clients-heading" class="pixel-heading">
            <span class="heading-icon" aria-hidden="true"><svg><use href="#icon-mobile"/></svg></span>
            <span data-i18n="clients.title"></span>
          </h2>
          <button class="section-collapse-button" type="button" data-action="toggle-section" data-section-toggle="clients" aria-expanded="true" aria-controls="clients-section-body" data-i18n-title="action.collapse">
            <svg aria-hidden="true"><use href="#icon-chevron"/></svg>
            <span class="visually-hidden" data-i18n="action.collapse"></span>
          </button>
        </div>
        <div id="clients-section-body" class="section-collapse-body" data-section-body="clients">
          <div id="client-list" class="entity-list section-collapse-inner" data-client-list aria-live="polite">
            <div class="empty-state is-entity-empty" data-empty-state="clients">
              <svg aria-hidden="true"><use href="#icon-info"/></svg>
              <strong data-i18n="clients.empty_title"></strong>
            </div>
          </div>
        </div>
      </section>
      <footer class="app-footer">FoxHole OpenWRT Client</footer>
    </main>
  </div>

  <dialog id="modal-shell" class="modal" aria-labelledby="modal-title">
    <header class="modal-header">
      <span class="modal-heading-icon" aria-hidden="true"><svg><use data-modal-icon href="#icon-shield"/></svg></span>
      <h2 id="modal-title" tabindex="-1" data-modal-title data-i18n="modal.title"></h2>
      <span class="inline-country" data-modal-country hidden></span>
    </header>
    <div id="modal-stage" class="modal-stage" data-modal-stage></div>
    <footer class="modal-footer" data-modal-footer></footer>
  </dialog>

  <div id="toast" class="toast" data-toast popover="manual" role="status" aria-live="polite" hidden>
    <span class="toast-icon" aria-hidden="true"><svg><use data-toast-icon href="#icon-check"/></svg></span>
    <span data-toast-text></span>
  </div>

  <template id="tpl-add-choice" data-template="add-choice">
    <div class="modal-panel" data-modal-view="add-choice" data-title-key="add.title">
      <div class="choice-grid">
        <button class="choice-card" type="button" data-action="add-server">
          <span class="choice-icon" aria-hidden="true"><svg><use href="#icon-server"/></svg></span>
          <strong data-i18n="add.server"></strong>
          <svg class="choice-chevron" aria-hidden="true"><use href="#icon-chevron"/></svg>
        </button>
        <button class="choice-card" type="button" data-action="add-client">
          <span class="choice-icon" aria-hidden="true"><svg><use href="#icon-mobile"/></svg></span>
          <strong data-i18n="add.client"></strong>
          <svg class="choice-chevron" aria-hidden="true"><use href="#icon-chevron"/></svg>
        </button>
      </div>
      <button id="add-choice-routes" class="outline-button is-full add-choice-routes" type="button" data-action="open-exceptions">
        <svg aria-hidden="true"><use href="#icon-globe"/></svg><span data-i18n="action.open_routes"></span>
      </button>
    </div>

                <span data-i18n="exceptions.column_name"></span>
                <span data-i18n="exceptions.column_route"></span>
                <span data-i18n="exceptions.column_actions"></span>
              </div>
        </div>
        <div id="saved-rules-body" class="section-collapse-body" data-section-body="saved-rules">
          <div class="section-collapse-inner">
            <div class="rule-table" data-rule-table="saved">
              <div class="rule-list" data-saved-rule-list aria-live="polite"></div>
            </div>
          </div>
        </div>
      </section>

    </div>
  </template>

  <template id="tpl-manual-address" data-template="manual-address">
    <div class="modal-panel" data-modal-view="manual-address" data-title-key="exceptions.manual_title">
      <form class="form-stack" data-manual-device-form autocomplete="off">
        <div class="manual-address-line">
          <input class="text-input" name="value" type="text" inputmode="decimal" maxlength="18" autocapitalize="off" spellcheck="false" data-manual-value data-i18n-placeholder="exceptions.ip_placeholder" required>
          <select class="compact-select" name="kind" data-manual-kind>
            <option value="ip" data-i18n="exceptions.ip_address"></option>
            <option value="mac" data-i18n="exceptions.mac_address"></option>
          </select>
        </div>
        <div class="setting-row is-contained" data-manual-bind-row>
          <span class="setting-icon" aria-hidden="true"><svg><use href="#icon-network"/></svg></span>
          <label class="setting-copy" for="manual-bind-mac"><strong data-i18n="exceptions.bind_mac"></strong></label>
          <span class="switch"><input id="manual-bind-mac" name="bindMac" type="checkbox" checked data-bind-mac><i aria-hidden="true"></i></span>
        </div>
        <div class="route-select-line">
          <span data-i18n="exceptions.route_label"></span>
          <div class="route-picker" data-route-picker data-popup>
            <input id="manual-address-route" type="hidden" name="route" value="direct" data-route-value data-address-route>
            <button class="route-picker-trigger" type="button" data-action="toggle-popup" data-popup-trigger aria-expanded="false" data-i18n-aria-label="exceptions.route_label">
              <svg data-route-icon aria-hidden="true"><use href="#icon-globe"/></svg>
              <span data-route-current data-i18n="route.direct"></span>
              <svg aria-hidden="true"><use href="#icon-chevron"/></svg>
            </button>
            <div class="route-picker-menu" role="listbox" data-route-menu data-popup-menu hidden>
              <button type="button" role="option" data-action="select-route" data-route="vpn" aria-selected="false"><svg aria-hidden="true"><use href="#icon-shield"/></svg><span data-i18n="route.vpn"></span></button>
              <button type="button" role="option" data-action="select-route" data-route="direct" aria-selected="true"><svg aria-hidden="true"><use href="#icon-globe"/></svg><span data-i18n="route.direct"></span></button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </template>

  <template id="tpl-network-management" data-template="network-management">
    <div class="modal-panel" data-modal-view="network-management" data-title-key="networks.title">
      <div class="tab-list" role="tablist" data-network-tabs>
        <button id="tab-servers" class="tab-button is-active" type="button" role="tab" aria-selected="true" aria-controls="panel-servers" data-network-tab="servers"><svg aria-hidden="true"><use href="#icon-server"/></svg><span data-i18n="servers.title"></span><b data-server-count>0</b></button>
        <button id="tab-clients" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="panel-clients" data-network-tab="clients"><svg aria-hidden="true"><use href="#icon-mobile"/></svg><span data-i18n="clients.title"></span><b data-client-count>0</b></button>
      </div>

      <section id="panel-servers" class="management-panel" role="tabpanel" aria-labelledby="tab-servers" data-network-panel="servers">
        <div class="management-list" data-management-servers>
          <div class="empty-state is-compact" data-management-empty="servers">
            <svg aria-hidden="true"><use href="#icon-server"/></svg>
            <span data-i18n="servers.empty_title"></span>
          </div>
        </div>
      </section>

      <section id="panel-clients" class="management-panel" role="tabpanel" aria-labelledby="tab-clients" data-network-panel="clients" hidden>
        <div class="management-list" data-management-clients>
          <div class="empty-state is-compact" data-management-empty="clients">
            <svg aria-hidden="true"><use href="#icon-mobile"/></svg>
            <span data-i18n="clients.empty_title"></span>
          </div>
        </div>
      </section>

    </div>
  </template>

  <template id="tpl-pin-change" data-template="pin-change">
    <div class="modal-panel" data-modal-view="pin-change" data-title-key="pin_change.title">
      <form id="pin-change-form" class="form-stack" data-pin-change-form autocomplete="off">
        <p class="muted" data-pin-setup-copy data-i18n="pin_setup.description" hidden></p>
        <label for="new-pin" data-i18n="pin_change.new_pin"></label>
        <input id="new-pin" class="text-input" name="newPin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password" data-new-pin required>
        <label for="repeat-pin" data-i18n="pin_change.repeat_pin"></label>
        <input id="repeat-pin" class="text-input" name="repeatPin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password" data-repeat-pin required>
      </form>
    </div>
  </template>

  <template id="tpl-help" data-template="help">
    <div class="modal-panel" data-modal-view="help" data-title-key="help.title">
      <section class="help-topic">
        <h3><svg aria-hidden="true"><use href="#icon-play"/></svg><span data-i18n="help.connect_title"></span></h3>
        <ol>
          <li data-i18n="help.connect_add"></li>
          <li data-i18n="help.connect_save"></li>
          <li data-i18n="help.connect_start"></li>
        </ol>
        <p class="muted" data-i18n="help.test_note"></p>
      </section>
      <section class="help-topic">
        <h3><svg aria-hidden="true"><use href="#icon-globe"/></svg><span data-i18n="help.rules_title"></span></h3>
        <ul>
          <li data-i18n="help.rules_direct"></li>
          <li data-i18n="help.rules_order"></li>
          <li data-i18n="help.rules_dns"></li>
          <li data-i18n="help.rules_country"></li>
        </ul>
      </section>
      <section class="help-topic">
        <h3><svg aria-hidden="true"><use href="#icon-shield"/></svg><span data-i18n="help.protection_title"></span></h3>
        <p data-i18n="help.protection"></p>
        <dl>
          <div><dt>WAN</dt><dd data-i18n="help.wan_measurement"></dd></div>
          <div><dt>VPN</dt><dd data-i18n="help.vpn_measurement"></dd></div>
        </dl>
      </section>
      <section class="help-topic">
        <h3><svg aria-hidden="true"><use href="#icon-key"/></svg><span data-i18n="help.access_title"></span></h3>
        <ul>
          <li data-i18n="help.access_pin"></li>
          <li data-i18n="help.access_recovery"></li>
          <li data-i18n="help.access_clients"></li>
          <li data-i18n="help.access_client_port"></li>
          <li data-i18n="help.hiddify"></li>
        </ul>
      </section>
    </div>
  </template>

  <template id="tpl-confirm-delete" data-template="confirm-delete">
    <div class="modal-panel" data-modal-view="confirm-delete" data-title-key="delete.title">
      <p class="delete-name" data-delete-name></p>
    </div>
  </template>

  <template id="tpl-confirm-regenerate" data-template="confirm-regenerate">
    <div class="modal-panel" data-modal-view="confirm-regenerate" data-title-key="client.regenerate">
      <p class="confirmation-copy" data-i18n="client.regenerate_confirm"></p>
    </div>
  </template>

  <template id="tpl-router-stats" data-template="router-stats">
    <div class="modal-panel" data-modal-view="router-stats" data-title-key="router.title">
      <div class="router-metrics" data-router-metrics></div>
      <section class="interface-stats">
        <h3 data-i18n="chart.wan"></h3>
        <table>
          <thead><tr><th data-i18n="router.direction"></th><th data-i18n="router.total"></th><th data-i18n="router.average"></th><th data-i18n="router.peak"></th><th data-i18n="router.history"></th></tr></thead>
          <tbody data-interface-stats="wan"></tbody>
        </table>
      </section>
      <section class="interface-stats">
        <h3 data-i18n="router.lan"></h3>
        <table>
          <thead><tr><th data-i18n="router.direction"></th><th data-i18n="router.total"></th><th data-i18n="router.average"></th><th data-i18n="router.peak"></th><th data-i18n="router.history"></th></tr></thead>
          <tbody data-interface-stats="lan"></tbody>
        </table>
      </section>
    </div>
  </template>

  <script src="./app.js?v=0.1.0-r41-ui1" type="module"></script>
</body>
</html>
