name: release-candidate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: openwrt-release-main
  cancel-in-progress: false

jobs:
  candidate:
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main' && github.repository == 'foxhole-team/foxhole-openwrt-client'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Read the release version
        id: version
        run: |
          version="$(cat config/release-version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Verify the signed main authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = public
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
            --jq .commit.verification.verified)" = true
          python3 - <<'PY'
          import os
          import subprocess
          import tempfile

          signing = "0B954B66780BDA4F5FC995224C80DC5BBBB25151"
          primary = "7D82C6B1AC24714024F37DFE1871E0B91FEAB141"
          with tempfile.TemporaryDirectory(prefix="openwrt-verify-") as home:
              environment = dict(os.environ, GNUPGHOME=home)
              subprocess.run([
                  "gpg", "--batch", "--import", "config/release-signers.asc"
              ], env=environment, check=True, capture_output=True)
              result = subprocess.run([
                  "git", "-c", "gpg.format=openpgp",
                  "-c", "gpg.openpgp.program=gpg",
                  "-c", "gpg.minTrustLevel=undefined",
                  "verify-commit", "--raw", os.environ["GITHUB_SHA"]
              ], env=environment, capture_output=True, text=True)
              signatures = [line.split() for line in result.stderr.splitlines()
                            if line.startswith("[GNUPG:] VALIDSIG ")]
              if result.returncode or len(signatures) != 1:
                  raise SystemExit("main has no valid OpenPGP signature")
              fields = signatures[0]
              if len(fields) != 12 or (fields[2], fields[11]) != (signing, primary):
                  raise SystemExit("main signer does not match the pinned owner key")
          print("main signature matches the pinned owner key")
          PY

      - name: Select the identical successful dev candidate
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_tree="$(git rev-parse 'HEAD^{tree}')"
          runs="$RUNNER_TEMP/openwrt-dev-runs.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=dev -f event=push -f status=success -f per_page=100 > "$runs"
          selected_run=
          selected_sha=
          while IFS=$'\t' read -r run_id dev_sha; do
            [[ "$run_id" =~ ^[0-9]+$ && "$dev_sha" =~ ^[0-9a-f]{40}$ ]] || continue
            dev_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$dev_sha" --jq .tree.sha)"
            [[ "$dev_tree" == "$main_tree" ]] || continue
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              --jq "[.artifacts[] | select(.name == \"openwrt-candidate-$dev_sha\" and .expired == false)] | length")"
            [[ "$count" == 1 ]] || continue
            selected_run="$run_id"
            selected_sha="$dev_sha"
            break
          done < <(jq -r '.workflow_runs[]
            | select((now - (.updated_at | fromdateiso8601)) >= 0
                and (now - (.updated_at | fromdateiso8601)) <= 86400)
            | [.id, .head_sha] | @tsv' "$runs")
          [[ -n "$selected_run" && -n "$selected_sha" ]] || {
            echo 'No successful dev push within 24 hours has this tree and candidate.' >&2
            exit 1
          }
          {
            echo "run_id=$selected_run"
            echo "source_sha=$selected_sha"
            echo "source_tree=$main_tree"
          } >> "$GITHUB_OUTPUT"
          gh run download "$selected_run" --repo "$GITHUB_REPOSITORY" \
            --name "openwrt-candidate-$selected_sha" --dir release-candidate

      - name: Verify candidate bytes and provenance
        env:
          DEV_RUN_ID: ${{ steps.source.outputs.run_id }}
          DEV_COMMIT: ${{ steps.source.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.source.outputs.source_tree }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re

          candidate = Path("release-candidate")
          payload = {
              "hysteria-2.12.2-r2.apk", "hysteria-ram-2.12.2-r1.apk",
              "foxhole-openwrt-client-0.1.0-r41.apk", "install.sh",
              "sdk.config", "feeds.buildinfo", "CANDIDATE.json",
              "foxhole-openwrt-client-source.zip",
              "foxhole-openwrt-client-source.zip.sha256",
          }
          files = list(candidate.iterdir())
          if {file.name for file in files} != payload | {"SHA256SUMS"}:
              raise SystemExit("Unexpected candidate files")
          if any(file.is_symlink() or not file.is_file() for file in files):
              raise SystemExit("Candidate contains a non-regular file")
          seen = set()
          for line in (candidate / "SHA256SUMS").read_text().splitlines():
              entry = re.fullmatch(r"([a-f0-9]{64})  ([A-Za-z0-9_.-]+)", line)
              if not entry or entry[2] not in payload or entry[2] in seen:
                  raise SystemExit("Invalid candidate checksum manifest")
              seen.add(entry[2])
              digest = hashlib.sha256((candidate / entry[2]).read_bytes()).hexdigest()
              if digest != entry[1]:
                  raise SystemExit("Candidate checksum mismatch")
          if seen != payload:
              raise SystemExit("Incomplete candidate checksum manifest")
          record = json.loads((candidate / "CANDIDATE.json").read_text())
          expected = {
              "schema": 1, "source_commit": os.environ["DEV_COMMIT"],
              "source_tree": os.environ["SOURCE_TREE"],
              "target": "openwrt-25.12.5-aarch64_generic",
              "package_signatures": "unsigned", "firmware_acceptance": "pending",
          }
          if record != expected:
              raise SystemExit("Candidate provenance mismatch")
          metadata = {
              "schema": 1, "main_commit": os.environ["GITHUB_SHA"],
              "dev_commit": os.environ["DEV_COMMIT"],
              "source_tree": os.environ["SOURCE_TREE"],
              "dev_run": os.environ["GITHUB_SERVER_URL"] + "/" +
                  os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" +
                  os.environ["DEV_RUN_ID"],
              "candidate_manifest_sha256": hashlib.sha256(
                  (candidate / "SHA256SUMS").read_bytes()).hexdigest(),
          }
          Path("RELEASE.json").write_text(json.dumps(metadata, indent=2) + "\n")
          print("Verified identical dev candidate; package bytes are unchanged")
          PY

      - name: Preserve the candidate for local hardware signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openwrt-release-${{ github.sha }}
          path: |
            release-candidate/
            RELEASE.json
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Prepare the release draft for local signing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          releases="$RUNNER_TEMP/releases.json"
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --slurp > "$releases"
          count="$(jq --arg tag "$tag" '[.[][] | select(.tag_name == $tag)] | length' "$releases")"
          if [[ "$count" != 0 ]]; then
            jq -e --arg tag "$tag" --arg sha "$SOURCE_COMMIT" \
              '[.[][] | select(.tag_name == $tag)] | length == 1 and \
              (.[0].draft == true and .[0].target_commitish == $sha)' "$releases"
            exit 0
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<'EOF'
          Public beta 1.0 prototype. Main and matching dev verification passed.
          Release assets are awaiting local APK signing and owner YubiKey signatures.
          Firmware traffic, load and reboot acceptance remain pending.
          EOF
          gh release create "$tag" --draft --prerelease --target "$SOURCE_COMMIT" \
            --title "FoxHole OpenWrt Client $VERSION" --notes-file "$notes"
